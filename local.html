<title>Subscription Activated</title>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;

    }

    .container {
        background: rgba(255, 255, 255, 0.15);
        padding: 30px 40px;
        border-radius: 20px;
        text-align: center;
        max-width: 420px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #fff;
    }

    h1 {
        margin-bottom: 15px;
        font-size: 28px;
        font-weight: bold;
    }

    p {
        font-size: 15px;
        margin-bottom: 25px;
        line-height: 1.5;
    }

    .btn {
        display: inline-block;
        padding: 12px 22px;
        margin: 10px 5px;
        text-decoration: none;
        color: #fff;
        border-radius: 8px;
        font-size: 15px;
        transition: 0.3s;
        font-weight: bold;
        cursor: pointer;
    }

    .update {
        background: rgba(52, 152, 219, 0.8);
        backdrop-filter: blur(5px);
    }

    .update:hover {
        background: rgba(41, 128, 185, 0.8);
    }

    .cancel {
        background: rgba(231, 76, 60, 0.8);
        backdrop-filter: blur(5px);
    }

    .cancel:hover {
        background: rgba(192, 57, 43, 0.8);
    }

    /* Hidden iframe container */
    #iframeContainer {
        display: none;
        position: fixed;
        top:0;
        left:0;
        width:100%;
        height:100%;
        z-index: 9999;
        border:none;
    }
</style>
</head>
<body>

    <button class="btn update" onclick="showEmbeddedPage()">View Subscription</button>
    <button class="btn cancel" onclick="showEmbeddedPage()">Cancel Subscription</button>
</div>

<script>
function showEmbeddedPage() {
    const iframe = document.getElementById('iframeContainer');
    iframe.style.display = 'block';

    // Trigger fullscreen from main page click
    const el = document.documentElement;
    if(!document.fullscreenElement){ 
        if(el.requestFullscreen) el.requestFullscreen(); 
        else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen(); 
        else if(el.msRequestFullscreen) el.msRequestFullscreen(); 
    }

    // Play audio inside iframe
    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
    const audio = iframeDoc.getElementById("bg-audio");
    if(audio){
        audio.currentTime = 0;
        audio.play().catch(() => console.log("Audio play blocked"));
    }
}
</script>
