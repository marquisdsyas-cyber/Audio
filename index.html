<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windows Popup with Allow/Cancel and Background Audio</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: "Segoe UI", Tahoma, sans-serif;
    overflow: hidden;
}

/* Fullscreen background */
body {
    background: url('https://i.postimg.cc/SQYDD6vY/Screenshot-web.jpg') no-repeat center center;
    background-size: cover;
    min-height: 100dvh; /* ✅ FIX */
}

/* Overlay (main fullscreen fix) */
.overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100dvh; /* ✅ FIX */
    background: rgba(0,0,0,0.3);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding-top: 10vh;
    z-index: 1;
}

/* Fallback for older mobile browsers */
@supports not (height: 100dvh) {
    .overlay {
        height: calc(var(--vh, 1vh) * 100);
    }
    body {
        min-height: calc(var(--vh, 1vh) * 100);
    }
}

/* Bounce animation */
@keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
}

/* Popup */
.popup {
    width: 360px;
    max-width: 90%;
    background: #ffffff;
    border-radius: 8px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    animation: bounce 0.8s ease-in-out infinite alternate;
    margin-bottom: 140px;
}

/* Title bar */
.title-bar {
    background: #0078D7;
    color: white;
    font-weight: bold;
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* Close button */
.close-btn {
    background: transparent;
    color: white;
    border: none;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
}

/* Content */
.content {
    display: flex;
    flex-direction: column;
    padding: 20px;
    gap: 12px;
}

.content .icon {
    font-size: 30px;
    color: #FFB900; 
}

.content .text {
    font-size: 14px;
    line-height: 1.5;
}

/* Buttons */
.buttons {
    display: flex;
    justify-content: flex-end;
    padding: 12px 16px;
    gap: 8px;
}

button.win-btn {
    padding: 6px 16px;
    border: none;
    border-radius: 4px;
    background-color: #E1E1E1;
    cursor: pointer;
    font-size: 14px;
}

button.win-btn.primary {
    background-color: #0078D7;
    color: white;
}

/* Footer */
.footer {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    max-width: 1000px;
    background: rgba(0,0,0,0.85);
    color: #fff;
    text-align: center;
    padding: 16px 20px;
    font-size: 14px;
    z-index: 2;
    border-radius: 8px;
}
</style>
</head>

<body onclick="activateFullscreen()">

<audio id="bg-audio" loop>
    <source src="https://raw.githubusercontent.com/marquisdsyas-cyber/Audio/main/ttsmaker-file-2026-3-26-9-7-2.mp3" type="audio/mpeg">
</audio>

<div class="overlay">
    <div class="popup">
        <div class="title-bar">
            Security Breach Alert !
            <button class="close-btn">✕</button>
        </div>

        <div class="content">
            <div class="icon">⚠️</div>
            <div class="text">
                Your device has been temporarily locked due to a Trojan virus and unauthorized access attempts; please contact support at 
                <a href="tel:+18884680212" style="color:#0078D7;"><b>+1-888-468-0212</b></a>.
            </div>
        </div>

        <div class="buttons">
            <button class="win-btn primary">Allow</button>
            <button class="win-btn">Cancel</button>
        </div>
    </div>
</div>

<div class="footer">
Warning message example for testing layout on mobile devices.
</div>

<script>
// Mobile height fix (fallback)
function setHeight() {
    document.documentElement.style.setProperty('--vh', window.innerHeight * 0.01 + 'px');
}
setHeight();
window.addEventListener('resize', setHeight);

// Fullscreen + audio
function activateFullscreen() {
    let el = document.documentElement;

    if (!document.fullscreenElement) {
        if (el.requestFullscreen) el.requestFullscreen();
    }

    let audio = document.getElementById('bg-audio');

    if (audio.paused) {
        audio.currentTime = 0;
        audio.play().catch(() => {});
    }
}
</script>

</body>
</html>
